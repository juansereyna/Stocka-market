<style>
:root{--surface:#F6F6F2;--surface-raised:#FFFFFF;--surface-sunken:#EDEDE7;--line:#E2E2DA;--line-strong:#879089;--ink:#1E2724;--ink-muted:#56605B;--ink-subtle:#7A837E;--pine:#2F5D50;--pine-strong:#234639;--pine-soft:#E3EEE9;--on-pine:#FFFFFF;--amber:#8A5B0C;--amber-soft:#F6EEDB;--rose:#A23E36;--rose-soft:#F8E7E4;--slate:#3F5D79;--slate-soft:#E6EDF4;--focus:#2F5D50;--shadow-sheet:0 -8px 32px rgba(30,39,36,.12);--shadow-pop:0 8px 28px rgba(30,39,36,.18);color-scheme:light;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-pill:999px;
  --chart-1:#2A6FBF;--chart-2:#D2702A;
  --font-sans:Manrope,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  /* alias de compatibilidad */
  --bg:var(--surface);--card:var(--surface-raised);--ink2:var(--ink-muted);--ink3:var(--ink-subtle);--green:var(--pine);--green2:var(--pine-soft);--green3:var(--pine);--accent:var(--pine);--accent2:var(--pine-soft);--warn:var(--amber);--warn2:var(--amber-soft);--bad:var(--rose);--bad2:var(--rose-soft);--blue:var(--slate);--blue2:var(--slate-soft);--r:16px}
@media (prefers-color-scheme: dark){:root{--surface:#111614;--surface-raised:#1A201E;--surface-sunken:#0C100E;--line:#29312D;--line-strong:#67716C;--ink:#E8EEEB;--ink-muted:#A3ADA8;--ink-subtle:#7E8883;--pine:#7DBBA6;--pine-strong:#A4D3C2;--pine-soft:#1C2E28;--on-pine:#0C1310;--amber:#E2B566;--amber-soft:#2E2616;--rose:#EE968C;--rose-soft:#3A2220;--slate:#9DBBD8;--slate-soft:#1D2733;--focus:#7DBBA6;--shadow-sheet:0 -8px 32px rgba(0,0,0,.5);--shadow-pop:0 8px 28px rgba(0,0,0,.5);--chart-1:#5A95DC;--chart-2:#D4783A;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
html{touch-action:manipulation;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,.tap,.chip,.item{-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
i[data-i]{display:inline-flex;width:1.25em;height:1.25em;vertical-align:-.25em;flex-shrink:0;font-style:normal}
i[data-i] svg{width:100%;height:100%}
#app{display:flex;min-height:100vh}
#side{display:none}

h1{font-size:24px;line-height:30px;margin:8px 0 14px;font-weight:700;letter-spacing:-.01em}

.sub{color:var(--ink-muted);font-size:14px;line-height:20px}
.tiny{color:var(--ink-muted);font-size:13px;line-height:18px}
.card{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-4);margin-bottom:var(--space-3)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}

.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.grid4{grid-template-columns:repeat(4,1fr)}}
.btn{min-height:48px;border:1px solid transparent;border-radius:var(--radius-md);padding:0 14px;white-space:nowrap;background:var(--pine);color:var(--on-pine);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--pine-soft);color:var(--pine)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.acc{background:var(--pine);color:var(--on-pine)}
.btn.danger{background:var(--rose-soft);color:var(--rose)}
.btn.full{width:100%}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px;border-radius:var(--radius-sm)}
.btn:disabled{opacity:.45}
.action{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 12px;min-height:88px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;font-weight:600;font-size:14px;text-align:left;color:var(--ink)}
.action .ic{width:36px;height:36px;border-radius:var(--radius-md);background:var(--surface-sunken);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px}
.action.hi{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.action.hi .ic{background:rgba(255,255,255,.14);color:var(--on-pine)}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:var(--radius-pill);background:var(--pine-soft);color:var(--pine);font-size:12px;font-weight:600;white-space:nowrap;border:0}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.bad{background:var(--rose-soft);color:var(--rose)}
.chip.blue{background:var(--slate-soft);color:var(--slate)}
.chip.grey{background:var(--surface-sunken);color:var(--ink-muted)}
button.chip{height:auto;min-height:36px;padding:0 12px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{border:1px solid var(--line);min-height:36px;padding:0 14px;border-radius:var(--radius-pill);background:var(--surface-raised);color:var(--ink-muted);font-weight:600;font-size:14px;white-space:nowrap}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.list{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:var(--space-3)}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:64px}
.item:last-child{border-bottom:0}
.item.tap{cursor:pointer}
.item.tap:active{background:var(--surface-sunken)}
.item .name{font-weight:600;line-height:22px}
.item.done .name{text-decoration:line-through;color:var(--ink-subtle)}
.tile{width:40px;height:40px;border-radius:var(--radius-md);background:var(--surface-sunken);color:var(--ink-muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.tile.pine{background:var(--pine-soft);color:var(--pine)}
.cathead{display:flex;align-items:center;gap:6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);font-weight:700;padding:18px 4px 8px}
.cathead i[data-i]{font-size:15px}
.seg{display:inline-flex;background:var(--surface-sunken);border-radius:var(--radius-md);padding:3px;gap:2px;flex-shrink:0}
.seg button{border:0;background:transparent;min-height:40px;min-width:54px;padding:0 8px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink-muted)}
.seg button.on{background:var(--surface-raised);box-shadow:0 0 0 1px var(--line)}
.seg button.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
.seg button.on.hay{color:var(--pine)}
.seg button.on.poco{color:var(--amber)}
.seg button.on.nohay{color:var(--rose)}
.check{width:28px;height:28px;border-radius:var(--radius-sm);border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--on-pine);font-size:18px}
.check.on{background:var(--pine);border-color:var(--pine)}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.big{font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.02em}
.bar{height:8px;border-radius:99px;background:var(--surface-sunken);overflow:hidden}
.bar>div{height:100%;background:var(--pine);border-radius:99px}
.bar.over>div{background:var(--rose)}
.hbar{display:grid;grid-template-columns:118px 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.hbar .t{height:10px;background:var(--surface-sunken);border-radius:99px;overflow:hidden}
.hbar .t>div{height:100%;background:var(--pine);border-radius:99px}
.up{color:var(--rose);font-weight:700}
.down{color:var(--pine);font-weight:700}
.flat{color:var(--ink-muted);font-weight:700}
.empty{text-align:center;padding:28px 16px;color:var(--ink-muted)}
.empty .ic{font-size:30px;width:56px;height:56px;border-radius:var(--radius-lg);background:var(--surface-sunken);color:var(--ink-muted);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.empty b{color:var(--ink);display:block;margin-bottom:4px}
label.f{display:block;font-weight:600;font-size:13px;margin:12px 0 6px;color:var(--ink-muted)}
input.i,select.i,textarea.i{width:100%;min-height:48px;border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:10px 12px;background:var(--surface-raised);font-size:16px;color:var(--ink)}
input.i::placeholder{color:var(--ink-subtle)}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:transparent}
input.i.flag,select.i.flag{border-color:var(--amber);background:var(--amber-soft)}
.search{position:relative}
.search i[data-i]{position:absolute;left:14px;top:14px;color:var(--ink-subtle)}
.search input.i{padding-left:42px}
.note{padding:12px;border-radius:var(--radius-md);font-size:14px;line-height:20px;margin:8px 0}
.note.warn{background:var(--amber-soft);color:var(--amber)}
.note.bad{background:var(--rose-soft);color:var(--rose)}
.note.info{background:var(--slate-soft);color:var(--slate)}
.note.ok{background:var(--pine-soft);color:var(--pine)}
.note a{color:inherit;font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;color:var(--ink-muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
nav#bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface-raised);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px calc(4px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(4px + env(safe-area-inset-left));z-index:20}
nav#bottom button{border:0;background:transparent;flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-subtle);border-radius:12px}
nav#bottom button .ic{font-size:24px;position:relative;display:flex}
nav#bottom button.on{color:var(--pine)}
nav#bottom .badge{position:absolute;top:-5px;right:-10px;background:var(--pine);color:var(--on-pine);font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 0 2px var(--surface-raised)}
nav#bottom button.plus{flex:0 0 72px}
nav#bottom button.plus .pc{width:54px;height:54px;margin-top:-24px;border-radius:var(--radius-lg);background:var(--pine);color:var(--on-pine);font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--surface-raised)}

@media(min-width:900px){
  nav#bottom{display:none}
  #side{display:flex;flex-direction:column;gap:2px;width:232px;padding:22px 12px;position:sticky;top:0;height:100vh;background:var(--surface-raised);border-right:1px solid var(--line)}
  #side .brand{padding:4px 12px 20px}
  #side button{border:0;background:transparent;text-align:left;min-height:44px;padding:0 12px;border-radius:var(--radius-md);font-weight:600;color:var(--ink-muted);display:flex;gap:12px;align-items:center;font-size:15px}
  #side button i[data-i]{font-size:20px}
  #side button.on{background:var(--pine-soft);color:var(--pine)}
  #side .sideadd{background:var(--pine);color:var(--on-pine);margin-bottom:12px;justify-content:center}
  main{padding:32px 32px 64px}
  .fab{right:32px}
}
#sheetwrap{position:fixed;inset:0;background:rgba(12,16,14,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
#sheetwrap.open{display:flex}
#sheet{background:var(--surface);width:100%;max-width:640px;max-height:calc(94vh - env(safe-area-inset-top));overflow-y:auto;overscroll-behavior:contain;border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:6px calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));animation:up .2s ease-out;box-shadow:var(--shadow-sheet);transition:transform .15s}
@media(min-width:700px){#sheetwrap{align-items:center}#sheet{border-radius:var(--radius-xl);max-height:88vh}}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
.backbtn{border:0;background:none;color:var(--pine);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:2px;min-height:40px;padding:0 10px 0 0;margin:0 0 -4px -6px}
.backbtn i[data-i]{font-size:22px}
@media(min-width:900px){.backbtn{display:none}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line-strong);opacity:.6;margin:4px auto 0}
@media(min-width:700px){.backbtn{border:0;background:none;color:var(--pine);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:2px;min-height:40px;padding:0 10px 0 0;margin:0 0 -4px -6px}
.backbtn i[data-i]{font-size:22px}
@media(min-width:900px){.backbtn{display:none}}
.grab{display:none}}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:-6px;background:var(--surface);padding:10px 0 12px;z-index:2}
.sheethead h2{margin:0;font-size:20px;line-height:26px;display:flex;align-items:center;gap:8px;min-width:0}
.x{border:0;background:var(--surface-sunken);color:var(--ink);width:44px;height:44px;border-radius:var(--radius-md);font-size:20px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.stickybar{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom));background:var(--surface);padding:12px 0 calc(4px + env(safe-area-inset-bottom));margin-top:12px;border-top:1px solid var(--line)}
.results{background:var(--surface-raised);border:1px solid var(--line-strong);border-radius:var(--radius-md);margin-top:6px;max-height:260px;overflow-y:auto}
.results button{display:flex;width:100%;text-align:left;border:0;background:transparent;border-bottom:1px solid var(--line);min-height:48px;padding:8px 12px;gap:10px;align-items:center;color:var(--ink)}
.results button:last-child{border-bottom:0}
.results button.new{color:var(--pine);font-weight:700}
.line{background:var(--surface-raised);border-radius:var(--radius-md);padding:12px;margin:8px 0;border:1px solid var(--line)}
.line.flag{border-color:var(--amber)}
.line.off{opacity:.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));animation:tin .2s ease-out;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:var(--radius-md);z-index:80;font-weight:600;font-size:14px;max-width:92vw;box-shadow:var(--shadow-pop)}
.toast .btn{background:var(--surface);color:var(--ink)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-muted);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-subtle)}
.dot.ok{background:var(--pine)}.dot.warn{background:var(--amber)}
.photo{width:100%;max-height:300px;object-fit:contain;border-radius:var(--radius-md);background:#000}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--pine-soft);border-top-color:var(--pine);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fab{position:fixed;right:16px;left:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:15;border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);max-width:688px;margin:0 auto}

.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qcard{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-xl);padding:28px 16px;text-align:center}

.qbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qbtns button{min-height:64px;border:0;border-radius:var(--radius-md);font-weight:700;font-size:16px}
svg.spark{width:100%;height:120px}
.muted{opacity:.6}
a{color:var(--pine)}
.hist{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-md);padding:10px 12px;margin:6px 0;display:flex;gap:10px;align-items:center}

.chart{width:100%;height:auto;display:block;margin-top:6px;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--line-strong);stroke-width:1}
.chart .ax{fill:var(--ink-muted);font-size:9.5px;font-family:var(--font-sans);font-variant-numeric:tabular-nums}
.chart .hit{fill:transparent;cursor:pointer}
.chart rect.hit.on{fill:var(--ink);fill-opacity:.05}
.chart circle.hit.on{fill:var(--pine);fill-opacity:.15}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-muted);font-weight:600;margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.charttip{position:fixed;z-index:90;background:var(--ink);color:var(--surface);font-size:13px;font-weight:600;padding:8px 10px;border-radius:var(--radius-sm);max-width:280px;pointer-events:none;display:none;box-shadow:var(--shadow-pop);font-variant-numeric:tabular-nums}
.ctable{margin-top:6px}
.ctable summary{font-size:13px;color:var(--ink-muted);font-weight:600;cursor:pointer;min-height:32px;display:flex;align-items:center}
.avatar{border-radius:50%;color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar.ghost{background:var(--surface-sunken);color:var(--ink-muted);font-size:20px}
.avbtn{border:0;background:none;padding:0;border-radius:50%;display:flex}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.swatch.on{border-color:var(--surface);box-shadow:0 0 0 2px var(--ink)}
#lock{position:fixed;inset:0;z-index:200;background:var(--surface);display:none;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.lockin{width:100%;max-width:340px}
.lockprofiles{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.lockprofiles button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;color:var(--ink-muted);padding:6px;border-radius:var(--radius-md);opacity:.55}
.lockprofiles button.on{opacity:1;color:var(--ink)}
.lockmsg{text-align:center;color:var(--ink-muted);font-size:14px;margin:22px 0 14px;min-height:20px}
.lockmsg a{color:var(--rose)}
.pindots{display:flex;gap:14px;justify-content:center;margin-bottom:26px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-strong);display:block}
.pindots i.on{background:var(--pine);border-color:var(--pine)}
.pindots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pinpad button{min-height:64px;border-radius:var(--radius-lg);border:1px solid var(--line);background:var(--surface-raised);font-size:24px;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:center}
.pinpad button:active{background:var(--surface-sunken)}
.pinpad button.sm{font-size:14px;color:var(--ink-muted);border-color:transparent;background:transparent}
.brandbar{display:flex;align-items:center;gap:10px}
.brandbar svg{display:block}
.greet{font-size:13px;color:var(--ink-muted);font-weight:600}
details>summary{list-style:none}
details>summary::-webkit-details-marker{display:none}
@media(max-width:390px){
  .item.inv{flex-wrap:wrap;gap:6px}
  .item.inv .seg{width:100%}
  .item.inv .seg button{flex:1}
  h1{font-size:22px}
  .big{font-size:26px}
  .qa button{min-height:88px}
}
</style>
</head>
